packages:
  - "apps/web"
  - "packages/*"
  - "scripts"
# Neither needs a postinstall for our use: @google/genai's script is optional
# telemetry setup, and protobufjs only rebuilds a descriptor cache it ships.
allowBuilds:
  '@google/genai': false
  # esbuild's postinstall resolves its platform binary; vitest needs it.
  esbuild: true
  protobufjs: false
