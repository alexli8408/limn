name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - name: protocol tests (convergence properties)
        run: pnpm --filter @limn/protocol test
      - name: shapes tests (recognition benchmark)
        run: pnpm --filter @limn/shapes test
      - name: web typecheck
        run: pnpm --filter @limn/web typecheck
        env:
          # The env module validates at import; these only need to be present.
          NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      - name: web tests
        run: pnpm --filter @limn/web test
      - name: web build
        run: pnpm --filter @limn/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      - run: pnpm --filter @limn/scripts typecheck

  vision:
    name: opencv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches PYTHON_VERSION in render.yaml. opencv-contrib 4.10 has no
          # wheels above cp312 and building from source times out.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/vision/requirements.txt
      - working-directory: apps/vision
        run: |
          pip install --no-cache-dir -r requirements.txt pytest==8.3.4 httpx==0.28.1
          python -m pytest tests -q

  database:
    name: migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: apply migrations and assert security properties
        run: ./supabase/tests/run.sh
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
